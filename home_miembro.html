<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nehemías · Maqueta Home del miembro</title>
<!--
  MAQUETA del "home" de la App 2 (congregación) tras ingresar. Usa los MISMOS
  colores de la App 1 de Nehemías (ver AGENTS.md §4).
  - Esta app NO es para aceptar servicios/tareas (eso queda en la App 1): no hay
    pestaña de "Servicios".
  - Miembro: Inicio (eventos + avisos), Familia, Perfil.
  - Líder: + "Mi equipo" (dashboard de su equipo).
  - Pastor general: + "Panel" con métricas como en la web: grupos/equipos con su
    % de aceptación, drill-down a cada equipo y a cada servidor.
  Prototipo visual con datos de ejemplo (no usa el backend).
-->
<style>
  :root{
    /* Paleta EXACTA de la App 1 (AGENTS.md §4) */
    --fondo:#0D0A15; --superficie:#1A1525; --superficie2:#221C2B; --morado:#7000FF;
    --cian:#4DD0E1; --texto:#FFFFFF; --texto2:#B0AEC4; --verde:#43A047; --naranja:#FB8C00; --rojo:#E53935;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#0D0A15;color:var(--texto);font-family:"Segoe UI",Roboto,system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:20px;}
  .telefono{width:100%;max-width:390px;height:790px;background:var(--fondo);border:1px solid #2a2440;
    border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);position:relative;}

  .appbar{padding:20px 18px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#15102a,var(--fondo));}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--morado),var(--cian));display:grid;place-items:center;font-weight:bold;font-size:18px;flex:0 0 auto;}
  .appbar .hola{font-size:13px;color:var(--texto2);}
  .appbar .nombre{font-size:17px;font-weight:bold;}
  .appbar .topacts{margin-left:auto;display:flex;align-items:center;gap:1px;}
  .appbar .campana{position:relative;background:none;border:0;color:var(--texto);cursor:pointer;padding:7px;border-radius:50%;line-height:0;}
  .appbar .campana:hover{background:#ffffff14;}
  .appbar .campana.activo{color:var(--cian);}
  .appbar .campana .mi{width:24px;height:24px;fill:currentColor;display:block;}
  .punto-rojo{position:absolute;top:3px;right:3px;width:9px;height:9px;background:var(--rojo);border-radius:50%;border:2px solid var(--fondo);}

  /* Panel de notificaciones de la semana (se abre con la campana) */
  .notis-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:5;}
  .notis-overlay.abierto{display:block;}
  .notis{position:absolute;top:60px;left:10px;right:10px;background:var(--superficie);border:1px solid #2a2440;
    border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:6;display:none;overflow:hidden;max-height:74%;}
  .notis.abierto{display:flex;flex-direction:column;}
  .notis-head{padding:12px 14px;font-weight:bold;font-size:14px;border-bottom:1px solid #2a2440;display:flex;align-items:center;gap:8px;color:var(--cian);}
  .notis-list{overflow-y:auto;}
  .noti{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid #221c2b;}
  .noti:last-child{border-bottom:0;}
  .noti .nico{width:34px;height:34px;border-radius:50%;background:var(--superficie2);display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
  .noti .ntxt{font-size:13px;line-height:1.4;}
  .noti .nmeta{color:var(--texto2);font-size:11px;margin-top:3px;}
  .noti.nuevo{background:#4DD0E10f;}
  .notis-vacio{padding:18px 14px;color:var(--texto2);font-size:13px;text-align:center;}

  .rolbar{padding:8px 14px;background:var(--superficie);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--texto2);}
  .rolbar select{background:var(--fondo);color:#fff;border:1px solid #3a3357;border-radius:7px;padding:4px 7px;font-size:11px;}
  .btn-crear-evento{background:linear-gradient(135deg,var(--morado),#9c4dff);color:#fff;border:0;border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
    box-shadow:0 2px 10px #7000ff55;}
  .btn-crear-evento:active{transform:scale(.97);}

  .contenido{flex:1;overflow-y:auto;padding:16px;}
  .seccion-tit{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--cian);margin:4px 0 12px;font-weight:bold;}
  .seccion-tit.mt{margin-top:24px;}

  .evento{background:var(--superficie);border-radius:14px;overflow:hidden;margin-bottom:14px;}
  .evento .banner{height:96px;display:grid;place-items:center;font-size:42px;}
  .evento .cuerpo{padding:13px;}
  .evento .titulo{font-weight:bold;font-size:16px;}
  .evento .meta{color:var(--texto2);font-size:12px;margin-top:3px;}
  .evento .desc{color:var(--texto2);font-size:12.5px;margin-top:7px;line-height:1.45;}
  .badge-canal{display:inline-block;background:#4DD0E126;color:var(--cian);border-radius:12px;padding:2px 9px;font-size:10px;font-weight:bold;margin-top:8px;}
  /* Pie de la tarjeta de evento con la acción de compartir */
  .evento .pie{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .btn-compartir{display:inline-flex;align-items:center;gap:6px;background:#7000FF22;color:#b388ff;
    border:1px solid #7000FF55;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:bold;cursor:pointer;}
  .btn-compartir:active{background:#7000FF40;}

  .aviso{display:flex;gap:10px;background:var(--superficie2);border-radius:10px;padding:11px 12px;margin-bottom:9px;}
  .aviso .ico{font-size:18px;}
  .aviso .txt{font-size:13px;}
  .aviso .fecha{color:var(--texto2);font-size:11px;margin-top:2px;}

  .item{display:flex;align-items:center;gap:12px;background:var(--superficie);border-radius:11px;padding:12px;margin-bottom:9px;}
  .item.click{cursor:pointer;}
  .item .mini{width:42px;height:42px;border-radius:50%;background:var(--morado);display:grid;place-items:center;font-weight:bold;flex:0 0 auto;}
  .item .nombre{font-weight:bold;}
  .item .meta{color:var(--texto2);font-size:12px;}
  .chevron{margin-left:auto;color:#6f6a85;font-size:22px;}
  .chip{display:inline-block;background:#7000FF26;color:#b388ff;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:bold;margin:3px 4px 0 0;}
  .metricas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .mchip{border-radius:20px;padding:3px 8px;font-size:11px;font-weight:bold;display:inline-flex;align-items:center;gap:5px;border:1px solid;}

  /* Encabezado de dashboard de equipo */
  .cab-equipo{background:linear-gradient(135deg,var(--morado),var(--cian));border-radius:14px;padding:16px;margin-bottom:14px;}
  .cab-equipo .pct{font-size:34px;font-weight:bold;}
  .cab-equipo .l{font-size:13px;opacity:.9;}
  /* Tiles del detalle */
  .tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .tile{flex:1;min-width:78px;background:var(--superficie);border-radius:10px;padding:11px 6px;text-align:center;}
  .tile .n{font-size:19px;font-weight:bold;}
  .tile .l{font-size:10px;color:var(--texto2);margin-top:2px;}
  .tile.click{cursor:pointer;border:1px solid transparent;}
  .tile.act{border-color:var(--cian);background:#4DD0E126;}
  .punto{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  /* Filtros (matrimonios/noviazgos) y botón de asistencia */
  .filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .fbtn{background:var(--superficie2);color:var(--texto2);border:1px solid #3a3357;border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;}
  .fbtn.activo{background:#4DD0E126;color:var(--cian);border-color:var(--cian);}
  .asis{border:0;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:bold;cursor:pointer;flex:0 0 auto;align-self:center;}
  .asis.si{background:#43A04726;color:var(--verde);}
  .asis.no{background:#E5393526;color:var(--rojo);}

  .btn{width:100%;background:var(--morado);color:#fff;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:8px;}
  .btn.sec{background:var(--superficie2);}
  .volver{background:var(--superficie2);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:bold;cursor:pointer;margin-bottom:14px;}
  label.f{display:block;font-size:12px;color:var(--texto2);margin:10px 0 4px;}
  input,select.full,textarea.full{width:100%;background:var(--fondo);border:1px solid #3a3357;color:#fff;border-radius:9px;padding:10px;font-size:13px;font-family:inherit;}
  textarea.full{resize:vertical;}
  .fila2{display:flex;gap:9px;} .fila2>div{flex:1;}
  .rolesbox{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .rolesbox label{display:flex;align-items:center;gap:5px;background:var(--fondo);border:1px solid #3a3357;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .rolesbox input{width:auto;}
  .switch{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer;}
  .switch input{width:auto;}
  .ok{color:var(--verde);font-size:12px;margin-top:8px;}
  .vacio{color:#6f6a85;font-size:13px;}

  .nav{display:flex;background:var(--superficie);border-top:1px solid #2a2440;}
  .nav button{flex:1;background:none;border:0;color:var(--texto2);padding:10px 2px 12px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .nav button .i{line-height:0;}
  .nav button .mi{width:23px;height:23px;fill:currentColor;display:block;}
  .nav button.activo{color:var(--cian);}

  /* Certificado (bautismo / presentación) §7.8 — temático según el tipo */
  .cert{border-radius:16px;padding:10px;margin-bottom:8px;position:relative;overflow:hidden;}
  .cert .orla{border-radius:14px;padding:18px 16px;text-align:center;position:relative;z-index:1;}
  .cert .emoji-top{font-size:34px;line-height:1.1;margin-bottom:2px;}
  .cert .ig{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:bold;}
  .cert h2{font-size:19px;margin:6px 0 12px;letter-spacing:.5px;}
  .cert .cuerpo{font-size:13.5px;line-height:1.8;}
  .cert .testigos{font-size:11px;margin-top:12px;opacity:.85;}
  /* Guirnalda decorativa en las esquinas (no formal) */
  .cert .deco span{position:absolute;font-size:20px;opacity:.55;z-index:0;pointer-events:none;}
  .cert .sellos{display:flex;justify-content:space-around;margin-top:20px;position:relative;z-index:1;}
  .cert .sello{width:78px;height:78px;border:2px dashed currentColor;border-radius:50%;display:flex;
    align-items:center;justify-content:center;text-align:center;font-size:9px;padding:8px;transform:rotate(-7deg);opacity:.85;}
  .cert .sello-img{width:84px;height:84px;display:flex;align-items:center;justify-content:center;}
  .cert .sello-img img{max-width:84px;max-height:84px;object-fit:contain;}

  /* 🍼 Tema "bebé" para el certificado de PRESENTACIÓN — color según el sexo */
  .cert.tema-bebe{color:#5b4a6b;font-family:"Trebuchet MS","Segoe UI",sans-serif;}
  /* 💙 Varón → celeste */
  .cert.tema-bebe.varon{background:linear-gradient(135deg,#cdeafe,#e8f6ff);}
  .cert.tema-bebe.varon .orla{border:3px dashed #5cb3f0;background:rgba(255,255,255,.6);}
  .cert.tema-bebe.varon .ig{color:#2f8fd6;}
  .cert.tema-bebe.varon h2{color:#1f6fb2;}
  /* 💗 Nena → rosa */
  .cert.tema-bebe.nena{background:linear-gradient(135deg,#fde0ee,#fff0f6);}
  .cert.tema-bebe.nena .orla{border:3px dashed #f7a8c4;background:rgba(255,255,255,.6);}
  .cert.tema-bebe.nena .ig{color:#e0719f;}
  .cert.tema-bebe.nena h2{color:#c2418a;}

  /* 💧 Tema "agua" para el certificado de BAUTISMO */
  .cert.tema-bautismo{background:linear-gradient(160deg,#bbdefb,#e1f5fe);color:#0d3b5c;
    font-family:Georgia,"Times New Roman",serif;}
  .cert.tema-bautismo .orla{border:3px solid #4fc3f7;background:rgba(255,255,255,.55);}
  .cert.tema-bautismo .ig{color:#0277bd;}
  .cert.tema-bautismo h2{color:#0288d1;}
</style>
</head>

// ── Compartir evento (cualquier miembro) ──────────────────────────────────────
// Comparte la IMAGEN del evento como foto + la descripción como texto, vía el menú
// nativo del teléfono (WhatsApp, Instagram, etc.). NO comparte un link: usa la Web
// Share API nivel 2 (files), así en redes/WhatsApp se ve como foto con pie de texto.
// Si el evento no tiene foto subida, se genera una tarjeta cuadrada (1080×1080).
function _coloresGrad(grad){
  const m = (grad||'').match(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})/g) || [];
  return m.length>=2 ? [m[0],m[1]] : ['#7000FF','#4DD0E1'];
}
function _envolverTexto(ctx,texto,x,y,maxAncho,interlineado){
  const palabras=texto.split(' '); let linea='';
  for(const p of palabras){
    const prueba=linea?linea+' '+p:p;
    if(ctx.measureText(prueba).width>maxAncho && linea){ ctx.fillText(linea,x,y); linea=p; y+=interlineado; }
    else linea=prueba;
  }
  if(linea) ctx.fillText(linea,x,y);
  return y;
}
// Genera (o trae) la imagen del evento como Blob para poder compartirla como archivo.
async function _imagenEventoBlob(e){
  if(e.imagen){ // foto real subida por Multimedia
    try{ const r=await fetch(e.imagen); return await r.blob(); }catch(_){ /* sigue al canvas */ }
  }
  const S=1080, c=document.createElement('canvas'); c.width=S; c.height=S;
  const ctx=c.getContext('2d');
  const [c1,c2]=_coloresGrad(e.color);
  const g=ctx.createLinearGradient(0,0,S,S); g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  // Velo oscuro en la mitad inferior para que el texto se lea.
  const v=ctx.createLinearGradient(0,S*0.45,0,S); v.addColorStop(0,'rgba(13,10,21,0)'); v.addColorStop(1,'rgba(13,10,21,0.82)');
  ctx.fillStyle=v; ctx.fillRect(0,S*0.45,S,S*0.55);
  ctx.textAlign='center';
  // Emoji grande
  ctx.font='300px "Segoe UI Emoji",serif'; ctx.fillText(e.emoji||'📅', S/2, 430);
  // Título (puede ocupar 2 líneas)
  ctx.fillStyle='#fff'; ctx.font='bold 76px "Segoe UI",Roboto,sans-serif';
  let y=_envolverTexto(ctx, e.titulo, S/2, 700, S-140, 92);
  // Meta (fecha · hora · lugar)
  ctx.fillStyle='#E0DEF0'; ctx.font='40px "Segoe UI",Roboto,sans-serif';
  const meta=[e.fecha,e.hora?('🕒 '+e.hora):'',e.lugar?('📍 '+e.lugar):''].filter(Boolean).join('   ·   ');
  ctx.fillText(meta, S/2, y+80);
  // Firma de la iglesia
  ctx.fillStyle='#9d96c4'; ctx.font='bold 34px "Segoe UI",Roboto,sans-serif';
  ctx.fillText(IGLESIA.toUpperCase()+' · NEHEMÍAS COMUNIDAD', S/2, S-70);
  return await new Promise(res=>c.toBlob(res,'image/png',0.92));
}
function _textoEvento(e){
  const meta=[e.fecha, e.hora?('🕒 '+e.hora):'', e.lugar?('📍 '+e.lugar):''].filter(Boolean).join(' · ');
  return `📅 *${e.titulo}*\n${meta}${e.desc?`\n\n${e.desc}`:''}\n\n— ${IGLESIA} · vía Nehemías Comunidad`;
}
async function compartirEvento(i){
  const e=DATA.eventos[i]; if(!e) return;
  const texto=_textoEvento(e);
  try{
    const blob=await _imagenEventoBlob(e);
    const file=new File([blob], 'evento.png', {type:blob.type||'image/png'});
    // Si el dispositivo puede compartir archivos, va la imagen + el texto como pie.
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:texto, title:e.titulo});
      return;
    }
  }catch(err){ if(err && err.name==='AbortError') return; /* el usuario canceló */ }
  // Respaldo: sin soporte de archivos, comparte el texto (o abre WhatsApp en escritorio).
  try{
    if(navigator.share){ await navigator.share({text:texto, title:e.titulo}); return; }
  }catch(err){ if(err && err.name==='AbortError') return; }
  window.open('https://wa.me/?text='+encodeURIComponent(texto), '_blank');
}

// El aniversario aplica al cónyuge y al noviazgo con propósito; la edad, a los hijos.
// Se muestra/oculta cada campo según la relación elegida.
function esPareja(rel){ return rel==='Cónyuge' || rel==='Noviazgo con propósito'; }
// Clasificación por edad (§7.7): la banda a la que pertenece un hijo cargado, según los
// rangos que define el pastor (DATA.rangosEdad, §7.10). Solo cuentan las bandas ACTIVAS;
// por debajo de la primera activa = menor; por encima de la última = miembro. Si cae en el
// hueco de un grupo desactivado, queda como miembro (la iglesia no tiene ese grupo).
const ORDEN_BANDAS=['escuelita','adolescentes','jovenes'];
function grupoEtario(edad){
  if(edad==null||isNaN(edad)) return null;
  const r=DATA.rangosEdad, activos=ORDEN_BANDAS.filter(k=>r[k].activo);
  for(const k of activos){ if(edad>=r[k].min && edad<=r[k].max) return k; }
  if(activos.length && edad < Math.min(...activos.map(k=>r[k].min))) return 'menor';
  return 'miembro';
}
function etiquetaGrupo(g){ return {menor:'👶 Menor', escuelita:'🎒 Escuelita', adolescentes:'🧒 Adolescente', jovenes:'🙌 Jóvenes', miembro:'🧑 Miembro'}[g]||''; }
const NOMBRE_GRUPO={menor:'Menor', escuelita:'Escuelita', adolescentes:'Adolescentes', jovenes:'Jóvenes', miembro:'Miembro'};
// 🎂 Cumpleaños automático (§7.10): al cumplir años, cada integrante pasa SOLO al grupo que
// le corresponde (Escuelita → Jóvenes → Miembro). En la maqueta se dispara con este botón;
// en producción lo hace un cron diario que recalcula la edad desde fecha_nacimiento.
function simularCumple(){
  const movidos=[];
  DATA.integrantesGF.forEach(p=>{
    const antes=grupoEtario(p.edad); p.edad++; const dsp=grupoEtario(p.edad);
    if(antes!==dsp) movidos.push({nombre:p.nombre, a:dsp});
  });
  // Mantener consistente el grupo familiar del usuario actual.
  DATA.familia.forEach(x=>{ if(x.rel==='Hijo/a'&&x.edad!=null){ x.edad++; x.grupo=grupoEtario(x.edad); } });
  // Avisos para los que cambiaron de grupo (encienden la campana).
  movidos.forEach(m=> NOTIS.unshift({ico:'🎂', txt:`<b>${m.nombre}</b> cumplió años y pasó a <b>${NOMBRE_GRUPO[m.a]||m.a}</b>`, meta:'Hoy', nuevo:true}));
  render();
}
function toggleRelFam(){
  const rel=document.getElementById('f_rel').value;
  document.getElementById('f_anivwrap').style.display = esPareja(rel) ? 'block' : 'none';

function agregarFam(){
  const n=document.getElementById('f_nombre').value.trim();
  const rel=document.getElementById('f_rel').value;
  const ok=document.getElementById('f_ok');
  if(!n){ok.style.color='var(--rojo)';ok.textContent='⚠️ Falta el nombre.';return;}
  const aniv=document.getElementById('f_aniv').value;
  if(esPareja(rel) && !aniv){ ok.style.color='var(--rojo)'; ok.textContent='⚠️ Tenés que poner la fecha (aniversario).'; return; }
  const item={rel, nombre:n};
  if(esPareja(rel)){
    item.aniversario=aniv;
    if(rel==='Cónyuge') DATA.miembro.aniversario=aniv;
    // Alimenta los aniversarios que ve el líder de matrimonios (nombre y apellido de ambos).
    DATA.aniversarios.push({conyuge1:DATA.miembro.nombre, conyuge2:n, fecha:aniv,
      tipo: rel==='Cónyuge'?'matrimonio':'noviazgo', asiste:true});
  } else if(rel==='Hijo/a'){
    const edad=parseInt(document.getElementById('f_edad').value,10);
    if(isNaN(edad)){ ok.style.color='var(--rojo)'; ok.textContent='⚠️ Tenés que poner la edad del hijo/a.'; return; }
    item.edad=edad; item.grupo=grupoEtario(edad);
    // Alimenta los dashboards de Escuelita (4-12) y Jóvenes (13-30).
    DATA.integrantesGF.push({nombre:n, edad, asiste:true, responsable:DATA.miembro.nombre});
  }
  DATA.familia.push(item);
  document.getElementById('famlist').innerHTML=listaFamilia();
  ok.style.color='var(--verde)';
  ok.textContent = esPareja(rel) ? '✓ Agregado · el aniversario ya lo ven los líderes de matrimonios.'
    : rel==='Hijo/a' ? `✓ Agregado · queda en ${etiquetaGrupo(item.grupo)}${['escuelita','adolescentes','jovenes'].includes(item.grupo)?' (ya aparece en el dashboard).':'.'}`
    : '✓ Integrante agregado.';
  document.getElementById('f_nombre').value='';
  if(document.getElementById('f_edad')) document.getElementById('f_edad').value='';
}

const BANDAS_EDAD=[

    ${BANDAS_EDAD.map(bloque).join('')}
    <p style="color:#6f6a85;font-size:11px;margin:10px 0">🧑 <b>Miembro</b>: por encima del último grupo activo (${n('miembro')} hoy). 👶 <b>Menor</b>: por debajo del primero (${n('menor')} hoy).</p>
    <button class="btn" onclick="guardarRangosEdad()">Guardar y reclasificar</button>
    <div class="ok" id="re_ok"></div>`;
}
function guardarRangosEdad(){
  const v=id=>parseInt(document.getElementById(id).value,10);
  const ok=document.getElementById('re_ok'); const err=t=>{ok.style.color='var(--rojo)';ok.textContent='⚠️ '+t;};
  const nuevo={};
  for(const {key} of BANDAS_EDAD){
    nuevo[key]={min:v('re_'+key+'_min'), max:v('re_'+key+'_max'), activo:document.getElementById('re_'+key+'_act').checked};
  }
  for(const {key,tit} of BANDAS_EDAD){
    if(isNaN(nuevo[key].min)||isNaN(nuevo[key].max)) return err('Completá las edades de '+tit+'.');
    if(nuevo[key].min>nuevo[key].max) return err('En '+tit+', "Desde" no puede ser mayor que "Hasta".');
  }
  // Los grupos ACTIVOS no pueden solaparse en edades.
  const act=BANDAS_EDAD.map(b=>b.key).filter(k=>nuevo[k].activo);
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    const a=nuevo[act[i]], b=nuevo[act[j]];
    if(a.min<=b.max && b.min<=a.max) return err('Los grupos activos no pueden solaparse en edades.');
  }
  DATA.rangosEdad=nuevo;
  // Reclasificar a los hijos guardados en los grupos familiares con los nuevos rangos.
  DATA.familia.forEach(x=>{ if(x.rel==='Hijo/a'&&x.edad!=null) x.grupo=grupoEtario(x.edad); });
  setSub(null);
}

// ---- Equipo de Matrimonios (líder/pastor): aniversarios de las parejas ----
// Días que faltan para el próximo aniversario y años que cumplirán ese día.
function proxAniv(iso){
  const f=new Date(iso+'T00:00:00'); const hoy=new Date(); hoy.setHours(0,0,0,0);
  let prox=new Date(hoy.getFullYear(), f.getMonth(), f.getDate());
  if(prox<hoy) prox=new Date(hoy.getFullYear()+1, f.getMonth(), f.getDate());
  return {dias:Math.round((prox-hoy)/86400000), anios:prox.getFullYear()-f.getFullYear()};
}
// Filtros tocables: si vuelvo a tocar el filtro activo, se desactiva (vuelve a 'todos').
function setFiltroMat(f){ FILTRO_MAT=(f===FILTRO_MAT&&f!=='todos')?'todos':f; render(); }
function setFiltroAsis(f){ FILTRO_ASIS=(f===FILTRO_ASIS&&f!=='todos')?'todos':f; render(); }
function toggleAsistencia(i){ DATA.aniversarios[i].asiste=!DATA.aniversarios[i].asiste; render(); }

// ---- Dashboards por grupo etario: Escuelita y Jóvenes ----
// Se arman con los integrantes que los miembros cargan en su grupo familiar (§7.7).
// Mismo patrón que Matrimonios: métricas + filtros tocables (sub-grupo de edad + asistencia).
const GRUPOS_EDAD = {
  jovenes:   {titulo:'Jóvenes',   emoji:'🙌', sustantivo:'jóvenes', reunion:'las reuniones de jóvenes', grad:'linear-gradient(135deg,#FB8C00,#7000FF)'},
  escuelita: {titulo:'Escuelita', emoji:'🎒', sustantivo:'niños',   reunion:'la escuelita',             grad:'linear-gradient(135deg,#43A047,#4DD0E1)'},
};
// Config viva de cada dashboard según las bandas que define el pastor (§7.10):
// - Escuelita = banda 'escuelita', partida en Pequeños/Grandes por un corte fijo (8).
// - Jóvenes   = bandas 'adolescentes' + 'jovenes' (las activas), cada una un sub-grupo.
// Devuelve {activo, min, max, pert:[bandas que pertenecen], subs:[{key,label,rango,test,color}]}.
function dashCfg(g){
  const r=DATA.rangosEdad;
  if(g==='escuelita'){
    const b=r.escuelita, corte=Math.min(Math.max(8,b.min+1),b.max);
    return {activo:b.activo, min:b.min, max:b.max, pert:['escuelita'], subs:[
      {key:'peq', label:'Pequeños', rango:`${b.min} a ${corte-1}`, test:e=>e>=b.min&&e<=corte-1, color:'#80deea'},
      {key:'gra', label:'Grandes',  rango:`${corte} a ${b.max}`,   test:e=>e>=corte&&e<=b.max,   color:'#4db6ac'},
    ]};
  }
  const defs=[
    {key:'ado', label:'Adolescentes',    band:r.adolescentes, color:'#ffb74d'},
    {key:'adu', label:'Jóvenes adultos', band:r.jovenes,      color:'#ff9e6d'},
  ].filter(d=>d.band.activo);
  const mins=defs.map(d=>d.band.min), maxs=defs.map(d=>d.band.max);
  return {
    activo:defs.length>0,
    min:mins.length?Math.min(...mins):0, max:maxs.length?Math.max(...maxs):0,
    pert:['adolescentes','jovenes'],
    subs:defs.map(d=>({key:d.key, label:d.label, rango:`${d.band.min} a ${d.band.max}`, test:e=>e>=d.band.min&&e<=d.band.max, color:d.color})),
  };
}

// Pantalla aparte: gestión del liderazgo de un equipo (líderes, co-líderes, colaboradores).
// Genérica para Matrimonios (§7.9), Jóvenes y Escuelita (§7.10).
const ROLES_EQ=['Líder','Co-líder','Colaborador'];
const PLURAL_EQ={'Líder':'Líderes','Co-líder':'Co-líderes','Colaborador':'Colaboradores'};
const TIT_EQ={matrimonios:'Matrimonios', jovenes:'Jóvenes', escuelita:'Escuelita'};

function cambiarRolLider(g,i,rol){ DATA.liderazgo[g][i].rol=rol; render(); }
function togglePermLider(g,i){ DATA.liderazgo[g][i].vePuede=!DATA.liderazgo[g][i].vePuede; render(); }
function quitarLider(g,i){ DATA.liderazgo[g].splice(i,1); render(); }
function vLiderazgo(g){
  const items=DATA.liderazgo[g].map((l,i)=>({...l,_i:i}));
  const grupos=ROLES_EQ.map(r=>{
    const gg=items.filter(l=>l.rol===r);
    if(!gg.length) return '';
    return `<div class="seccion-tit mt">${PLURAL_EQ[r]} (${gg.length})</div>
      ${gg.map(l=>`<div class="item" style="align-items:flex-start"><div class="mini">${inicial(l.nombre)}</div>
        <div style="flex:1"><div class="nombre">${l.nombre}</div>
          <label class="switch" style="margin-top:6px;font-size:11px"><input type="checkbox" ${l.vePuede?'checked':''} onchange="togglePermLider('${g}',${l._i})"> 👁️ ve ${VE_EQ[g]}</label>
          <select class="full" style="margin-top:7px" onchange="cambiarRolLider('${g}',${l._i},this.value)">${ROLES_EQ.map(o=>`<option ${o===l.rol?'selected':''}>${o}</option>`).join('')}</select>
        </div>
        <button class="volver" style="margin:0 0 0 6px" onclick="quitarLider('${g}',${l._i})">Quitar</button>
      </div>`).join('')}`;
  }).join('');
  return `<button class="volver" onclick="setSub(null)">← ${TIT_EQ[g]}</button>
    <div class="seccion-tit">Liderazgo del equipo de ${TIT_EQ[g]}</div>
    <p style="color:#6f6a85;font-size:11px;margin:-4px 0 10px">Gestioná quiénes son <b>líderes</b>, <b>co-líderes</b> y <b>colaboradores</b>. Quienes tengan permiso <b>ven ${VE_EQ[g]}</b>.</p>

    ${grupos || '<div class="vacio">Todavía no hay nadie en el liderazgo.</div>'}`;
}
// Form para sumar un servidor/miembro al liderazgo de un equipo.
function formLider(g){
  const yaEstan = DATA.liderazgo[g].map(l=>l.nombre);
  const cand = DATA.directorio.filter(m=>!yaEstan.includes(m.nombre));
  return `<button class="volver" onclick="setSub({lider:true})">← Liderazgo</button>
    <div class="seccion-tit">Sumar al liderazgo de ${TIT_EQ[g]}</div>
    ${cand.length ? `
      <label class="f">Servidor / miembro</label>
      <select class="full" id="lm_persona">${cand.map(m=>`<option>${m.nombre}</option>`).join('')}</select>
      <label class="f">Rol en el equipo</label>
      <select class="full" id="lm_rol"><option>Colaborador</option><option>Co-líder</option><option>Líder</option></select>
      <label class="switch"><input type="checkbox" id="lm_perm" checked> Permiso para ver ${VE_EQ[g]}</label>
      <button class="btn" onclick="guardarLider('${g}')">Agregar al liderazgo</button>
      <div class="ok" id="lm_ok"></div>`
    : '<div class="vacio">Ya están todos los miembros del directorio en el liderazgo.</div>'}`;
}
function guardarLider(g){
  const sel=document.getElementById('lm_persona');
  if(!sel||!sel.value){ document.getElementById('lm_ok').textContent='⚠️ No hay a quién agregar.'; return; }
  DATA.liderazgo[g].push({nombre:sel.value, rol:document.getElementById('lm_rol').value, vePuede:document.getElementById('lm_perm').checked});
  setSub({lider:true}); // vuelve a la pantalla de liderazgo
}

function guardarPresentacion(){
  const nino=document.getElementById('pr_nino').value.trim();
  const fecha=document.getElementById('pr_fecha').value;
  if(!nino||!fecha){ document.getElementById('pr_ok').textContent='⚠️ Falta el nombre o la fecha de presentación.'; return; }
  const reg={
    nino, fecha,
    sexo:document.getElementById('pr_sexo').value,
    fechaNac:document.getElementById('pr_nac').value,
    lugarNac:document.getElementById('pr_lugarnac').value.trim()||'—',
    lugarPres:document.getElementById('pr_lugarpres').value.trim()||IGLESIA,
    padres:document.getElementById('pr_padres').value.trim()||'—',
    testigos:document.getElementById('pr_testigos').value.trim()||'',
    oficiante:document.getElementById('pr_ofi').value.trim()||''
  };
  DATA.presentaciones.push(reg);
  setSub({g:'presentaciones', cert:reg}); // muestra el certificado generado
}

// ---- Sellos personalizados (se suben en Perfil, líder/pastor) ----
function sellosConfigHtml(){
  const item=(tipo,label)=> SELLOS[tipo]
    ? `<div class="item"><img src="${SELLOS[tipo]}" style="width:46px;height:46px;border-radius:8px;object-fit:contain;background:#fff;flex:0 0 auto"><div><div class="nombre" style="font-size:14px">${label}</div><div class="meta">✓ Cargado</div></div><button class="volver" style="margin:0 0 0 auto" onclick="quitarSello('${tipo}')">Quitar</button></div>`
    : `<label class="item click" for="file_${tipo}"><div class="mini" style="background:var(--superficie2)">＋</div><div><div class="nombre" style="font-size:14px">${label}</div><div class="meta">Tocá para subir (PNG/JPG)</div></div><input id="file_${tipo}" type="file" accept="image/*" style="display:none" onchange="subirSello('${tipo}',event)"></label>`;
  return item('iglesia','Sello de la iglesia') + item('pastor','Sello / firma del pastor');
}
function subirSello(tipo,ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ SELLOS[tipo]=e.target.result; const box=document.getElementById('sellosbox'); if(box) box.innerHTML=sellosConfigHtml(); };
  r.readAsDataURL(f);
}
function quitarSello(tipo){ SELLOS[tipo]=''; const box=document.getElementById('sellosbox'); if(box) box.innerHTML=sellosConfigHtml(); }

// ---- Certificados (bautismo / presentación), SUITE §7.8 ----
// Usa el sello subido si existe; si no, un marcador de posición.
function certShell(o){
  // o = {tema, emoji, deco, titulo, cuerpo, testigos}
  const sello=(tipo,txt)=> SELLOS[tipo]
    ? `<div class="sello-img"><img src="${SELLOS[tipo]}"></div>`
    : `<div class="sello">${txt}</div>`;
  return `
    <div class="cert ${o.tema}">
      <div class="deco">${o.deco}</div>
      <div class="orla">
        <div class="emoji-top">${o.emoji}</div>
        <div class="ig">${IGLESIA}</div>
        <h2>${o.titulo}</h2>
        <div class="cuerpo">${o.cuerpo}</div>
        ${o.testigos?`<div class="testigos">Testigos: ${o.testigos}</div>`:''}
        <div class="sellos">${sello('iglesia','Sello de la<br>iglesia')}${sello('pastor','Sello / firma<br>del pastor')}</div>
      </div>
    </div>`;
}

function certPresentacion(d){
  const esNena = d.sexo==='nena';
  // Color del certificado según el sexo: nena → rosa, varón → celeste.
  const tema = esNena ? 'tema-bebe nena' : 'tema-bebe varon';
  const emoji = esNena ? '👶🎀' : '👶💙';
  const deco = esNena
    ? `<span style="top:8px;left:10px">🧸</span><span style="top:10px;right:12px">🎀</span>
       <span style="bottom:96px;left:8px">⭐</span><span style="bottom:92px;right:10px">☁️</span>
       <span style="bottom:10px;left:16px">🍼</span><span style="bottom:12px;right:18px">💗</span>`
    : `<span style="top:8px;left:10px">🧸</span><span style="top:10px;right:12px">🎈</span>
       <span style="bottom:96px;left:8px">⭐</span><span style="bottom:92px;right:10px">☁️</span>
       <span style="bottom:10px;left:16px">🍼</span><span style="bottom:12px;right:18px">💙</span>`;
  const cuerpo=`Por la presente se hace constar que<br>
    <b style="font-size:16px">${d.nino}</b>,<br>
    nacido/a en la ciudad de <b>${d.lugarNac}</b>${d.fechaNac?`, el <b>${fv(d.fechaNac)}</b>`:''},<br>
    fue presentado/a en <b>${d.lugarPres}</b>, el <b>${fv(d.fecha)}</b>${d.oficiante?`,<br>por <b>${d.oficiante}</b>`:''}.`;

    <div class="ok" style="margin-bottom:10px">✓ Presentación registrada · certificado generado</div>
    ${certShell({tema, emoji, deco, titulo:'Certificado de Presentación', cuerpo, testigos:d.testigos})}

    <button class="btn sec" onclick="alert('(maqueta) Compartir certificado')">Compartir</button>`;
}

// Sintetiza un detalle plausible a partir de los totales (maqueta).
function detalleDe(s){
  const racha = s.cumplimiento>=95?6 : s.cumplimiento>=85?4 : s.cumplimiento>=75?2 : 0;
  const eventos=['Culto Domingo','Reunión de Oración','Vigilia','Servicio Especial','Reunión Jóvenes'];
  const motivos=['Viaje familiar','Trabajo','Problema de salud'];
  let sem=0; const ff=()=>{const d=new Date('2026-05-31');d.setDate(d.getDate()-sem*7);sem++;const p=d.toISOString().slice(0,10).split('-');return `${p[2]}-${p[1]}-${p[0]}`;};
  const hist=[];
  for(let i=0;i<Math.min(s.completadas,4);i++) hist.push({nombre:eventos[i%5],fecha:ff(),area:DATA.miembro.equipo,status:'Aceptado',motivo:''});
  for(let i=0;i<s.rechazos;i++) hist.push({nombre:eventos[(i+2)%5],fecha:ff(),area:'Área',status:'Rechazado',motivo:motivos[i%3]});
  for(let i=0;i<s.pendientes;i++) hist.push({nombre:eventos[(i+1)%5],fecha:ff(),area:'Área',status:'Pendiente',motivo:''});
  const ausencias = s.rechazos>1 ? [{motivo:'Vacaciones',fi:'2026-07-10',ff:'2026-07-20'}] : [];
  return {racha,hist,ausencias};
}

// ---- Sesión REAL (login real) ----------------------------------------------
// Si entrás con tu cuenta real (login_miembro.html → ?real=1), se usa tu nombre y tu
// ROL real, y se reemplaza el equipo de Multimedia de ejemplo por el TUYO, traído en vivo
// del backend. El resto de los datos siguen siendo de maqueta (la App 2 aún no existe).
function rolMaqueta(rolBackend){
  const r=(rolBackend||'').toLowerCase();
  // En la App 1 el rol es admin/líder/user. Lo mapeamos a los roles de la suite.
  if(r==='admin'||r==='líder'||r==='lider') return 'lider';
  if(r==='pastor') return 'pastor';
  return 'miembro';
}
async function traerEquipoReal(equipoId){
  // Reemplaza el equipo "Multimedia" de ejemplo por el real (mismo formato que DATA.equipos).
  const poner=(nombre, servidores, sinMetricas)=>{
    DATA.miembro.equipo = nombre;
    const real={
      nombre, real:true, sinMetricas:!!sinMetricas,
      cumplimiento: servidores.length?Math.round(servidores.reduce((a,s)=>a+(s.cumplimiento||0),0)/servidores.length):0,
      pendientes: servidores.reduce((a,s)=>a+(s.pendientes||0),0),
      rechazos: servidores.reduce((a,s)=>a+(s.rechazos||0),0),
      servidores
    };
    const i=DATA.equipos.findIndex(e=>/multimedia/i.test(e.nombre));
    if(i>=0) DATA.equipos[i]=real; else DATA.equipos.unshift(real);
    render();
  };
  // 1) dashboard_equipo: trae métricas por servidor (puede no estar desplegado en Render).
  try{
    const r=await fetch(`${API}/api/dashboard_equipo?equipo_id=${equipoId}`);
    if(r.ok){
      const d=await r.json();
      if(d.status==='success' && Array.isArray(d.servidores)){
        poner(d.nombre_ministerio||'Multimedia', d.servidores.map(s=>({
          nombre:s.nombre, cumplimiento:s.cumplimiento??0,
          completadas:s.tareas_completadas||0, pendientes:s.tareas_pendientes||0, rechazos:s.tareas_rechazadas||0
        })), false);
        return;
      }
    }
  }catch(e){ /* sigo al fallback */ }
  // 2) get_equipo: trae los integrantes reales (sin métricas de cumplimiento).
  try{
    const r=await fetch(`${API}/api/get_equipo`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({equipo_id:equipoId})});
    if(r.ok){
      const d=await r.json();
      const us=d.usuarios||[];
      poner(d.nombre_ministerio||'Multimedia', us.map(u=>({
        nombre:u.nombre||u.nombre_completo||'—', cumplimiento:0, completadas:0, pendientes:0, rechazos:0
      })), true);
      return;
    }
  }catch(e){ /* queda el equipo de maqueta */ }
  console.warn('No se pudo traer el equipo real (CORS o backend dormido). Queda el de maqueta.');
}
async function cargarSesionReal(){
  if(new URLSearchParams(location.search).get('real')!=='1') return; // solo tras login real
  let s=null; try{ s=JSON.parse(sessionStorage.getItem('neh_sesion')||'null'); }catch(e){}
  if(!s){ return; }
  DATA.miembro.nombre = s.nombre || DATA.miembro.nombre;
  ROL = rolMaqueta(s.rol);
  DATA.roles = ROL==='pastor' ? ['miembro','servidor','lider','pastor']
             : ROL==='lider'  ? ['miembro','servidor','lider'] : ['miembro'];
  if(!tabsActuales().some(t=>t.id===TAB) && !TABS_TOP.includes(TAB)) TAB='inicio';
  render(); // pinta ya con nombre/rol real (equipo aún de maqueta)
  if(s.equipo_id) await traerEquipoReal(s.equipo_id); // luego reemplaza el equipo real
}

render();
cargarSesionReal();
</script>
